plugins { id 'com.android.application' }

android {
    namespace 'com.shuttercat.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shuttercat.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        def appUrl = providers.gradleProperty('MEOW_APP_URL').getOrElse('')
        buildConfigField 'String', 'APP_URL', groovy.json.JsonOutput.toJson(appUrl)
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}

// Keep source files UTF-8 even when the Gradle daemon uses the Windows native encoding.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Package the same catalog used by the web UI; no duplicate native translation table.
def localeAssets = layout.buildDirectory.dir('generated/localeAssets')
tasks.register('syncLocaleAssets', Copy) {
    from(rootProject.file('../shared/locales.json'))
    into(localeAssets)
}
android.sourceSets.main.assets.srcDir(localeAssets)
tasks.named('preBuild').configure { dependsOn('syncLocaleAssets') }
